<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vérisource – Prototype interactif</title>
<style>
:root{--a:#3056C8;--a9:#1F3C8F;--a8:#2648B0;--a5:#7D97DE;--a3:#B9C9F1;--a2:#DCE4F8;--a1:#EEF2FC;--t:#2B2B2B;--t2:#3D3D3D;--t3:#4A4A4A;--t4:#5F5F5F;--b:#DADADA}
*{box-sizing:border-box}
body{margin:0;background:#F3F3F3;color:var(--t);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.app{min-height:100vh;display:flex;flex-direction:column}
.titlebar{display:flex;align-items:center;gap:16px;padding:10px 16px;background:#FAFAFA;border-bottom:1px solid #E2E2E2;flex-wrap:wrap}
.dots{display:flex;gap:8px}.dots span{width:12px;height:12px;border-radius:50%;background:#CFCFCF}
.toggle{width:30px;height:16px;border-radius:999px;background:var(--a);position:relative;display:inline-block}.toggle:after{content:"";position:absolute;right:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#fff}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--b);border-radius:6px;padding:5px 10px;color:#6B6B6B;font-size:12px;background:#fff}
.tabs{display:flex;align-items:flex-end;gap:4px;padding:0 16px;background:#FAFAFA;flex-wrap:wrap}
.tabs .t{font-size:13px;color:var(--t2);background:transparent;border:0;padding:10px 12px}
.tabs .t.on{font-weight:700;color:var(--a8);border-bottom:3px solid var(--a);padding-bottom:7px}
.ribbon{display:flex;align-items:stretch;padding:8px 16px;background:#fff;border-top:1px solid #E2E2E2;border-bottom:1px solid #E2E2E2;flex-wrap:wrap;row-gap:8px}
.grp{display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:4px;padding:0 14px;border-right:1px solid #E8E8E8}.grp:last-child{border-right:0}
.grp .cap{font-size:11px;color:#6B6B6B}
.rb{font-size:12px;color:var(--t2);background:transparent;border:1px solid transparent;border-radius:8px;padding:6px 10px;min-height:52px;display:flex;flex-direction:column;align-items:center;gap:4px}
.rb.on{color:var(--a9);background:var(--a1);border-color:var(--a2)}
.rb.primary{color:#fff;background:var(--a);border:0;font-weight:600;padding:8px 14px}
.main{flex:1;display:flex;flex-wrap:wrap;align-items:stretch}
.docarea{flex:999 1 700px;min-width:0;background:#E6E6E6;padding:28px 24px 40px;display:flex;justify-content:center;gap:16px;flex-wrap:wrap;align-items:flex-start}
.page{width:680px;max-width:100%;background:#fff;box-shadow:0 1px 4px rgba(40,40,40,.18);padding:56px 72px 48px;font-family:Aptos,Calibri,Carlito,"Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.65}
.page h1{margin:0 0 18px;font-size:22px;font-weight:600;color:var(--a9);line-height:1.3}
.page h2{margin:18px 0 8px;font-size:16px;font-weight:600;color:var(--t2)}
.page p{margin:0 0 12px;text-align:justify}
.hl{color:inherit;margin:0;border:0;border-radius:2px;display:inline;text-align:left;white-space:normal;overflow-wrap:anywhere;line-height:inherit;padding:0;background:transparent;cursor:text;font:inherit}
.hl.err{cursor:pointer;padding:0 2px;background:#E6ECFA;text-decoration:underline wavy var(--a);text-underline-offset:3px}
.hl.warn{cursor:pointer;padding:0 2px;text-decoration:underline dashed var(--a);text-decoration-thickness:2px;text-underline-offset:3px}
.hl.act{cursor:pointer;padding:0 2px;background:#C9D6F5;text-decoration:underline wavy var(--a9);text-underline-offset:3px}
.fixed{background:var(--a1);border-radius:2px;padding:0 2px}
.notes{margin-top:8px;font-size:12px;line-height:1.5;display:flex;flex-direction:column;gap:5px;color:var(--t2)}
.note{padding:2px 0}.note.on{background:var(--a2);border-radius:4px;padding:2px 4px;margin:0 -4px}
.card{margin:2px 0 18px;border:1px solid var(--a3);border-radius:8px;background:#fff;box-shadow:0 6px 20px rgba(40,40,40,.12);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13px;line-height:1.45;overflow:hidden;text-align:left}
.card.panel{margin:0;border:2px solid var(--a);box-shadow:none;border-radius:10px}
.card .hd{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--a1);border-bottom:1px solid var(--a2);flex-wrap:wrap}
.card .ty{font-weight:700;color:var(--a9)}
.pill{font-size:11px;color:var(--t2);padding:1px 8px;border:1px solid var(--a3);border-radius:999px;background:#fff}
.card .loc{margin-left:auto;color:var(--t4);font-size:12px}
.x{background:transparent;border:0;padding:4px;color:var(--t4);display:flex}
.card .bd{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.card .ti{font-weight:600}
.ext{background:#F5F5F5;border-radius:6px;padding:8px 10px;color:var(--t2);font-size:12.5px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.bp{font-size:13px;font-weight:600;color:#fff;background:var(--a);border:0;border-radius:6px;padding:8px 12px;min-height:36px;text-align:left}
.bs{font-size:13px;color:var(--a8);background:#fff;border:1px solid var(--a3);border-radius:6px;padding:8px 12px;min-height:36px}
.bg{font-size:13px;color:var(--t3);background:#fff;border:1px solid var(--b);border-radius:6px;padding:8px 12px;min-height:36px}
.comments{width:250px;display:flex;flex-direction:column;gap:12px;padding-top:120px}
.cm{background:#fff;border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 1px 3px rgba(40,40,40,.12);border:1px solid var(--b)}
.cm.on{border:2px solid var(--a)}
.av{width:26px;height:26px;border-radius:50%;background:var(--a);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.cm .msg{font-size:12.5px;line-height:1.45;color:var(--t2)}
.cmb1{font-size:12px;font-weight:600;color:var(--a8);background:var(--a1);border:0;border-radius:6px;padding:6px 10px}
.cmb2{font-size:12px;color:var(--t3);background:transparent;border:1px solid var(--b);border-radius:6px;padding:6px 10px}
aside{flex:1 1 380px;max-width:420px;min-width:0;background:#fff;border-left:1px solid var(--b);display:flex;flex-direction:column}
.ph{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #E8E8E8}
.logo{width:30px;height:30px;border-radius:8px;background:var(--a);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.ptabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid #E8E8E8;flex-wrap:wrap}
.ptab{font-size:13px;background:transparent;border:0;padding:12px 8px 9px;color:var(--t3);border-bottom:3px solid transparent}
.ptab.on{color:var(--a9);font-weight:700;border-bottom-color:var(--a)}
.pbody{flex:1;padding:16px;display:flex;flex-direction:column;gap:16px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:32px 12px;border:1px dashed var(--a3);border-radius:10px;background:#F7F9FE}
.big{font-size:14px;font-weight:600;color:#fff;background:var(--a);border:0;border-radius:8px;padding:10px 18px;min-height:44px}
.scorebox{display:flex;align-items:center;gap:16px;padding:16px;border:1px solid var(--a2);border-radius:10px;background:#F7F9FE}
.ring{width:88px;height:88px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center}
.ring>div{width:72px;height:72px;border-radius:50%;background:#F7F9FE;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:var(--a9)}
.lbl{font-size:12px;font-weight:700;color:var(--t4);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.mrow{text-align:left;display:flex;align-items:center;gap:10px;background:#fff;border:0;border-bottom:1px solid #EEE;padding:10px 4px;color:var(--t);width:100%}
.dot{width:10px;height:10px;border-radius:50%;flex:none}.dot.e{background:var(--a)}.dot.w{background:#fff;border:2px solid var(--a)}.dot.n{background:#D5D5D5}
.soft{font-size:13px;font-weight:600;color:var(--a8);background:var(--a1);border:1px solid var(--a2);border-radius:8px;padding:10px 14px;min-height:44px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;border-radius:999px;padding:5px 10px;background:#fff;color:var(--t2);border:1px solid #CFCFCF}.chip.on{background:var(--a);color:#fff;border-color:var(--a)}
.prow{text-align:left;display:flex;align-items:center;gap:10px;width:100%;border-radius:8px;padding:10px;background:#fff;border:1px solid #E8E8E8;margin-bottom:6px}
.prow.on{background:var(--a1);border-color:var(--a3)}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ok{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--a9);background:var(--a1);border-radius:8px;padding:12px}
.done{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--t3);padding:6px 4px;border-bottom:1px solid #F0F0F0}
.field{font:inherit;font-size:13px;border:1px solid #CFCFCF;border-radius:6px;padding:8px 10px;width:100%}
.blist{border:1px solid #E8E8E8;border-radius:8px;overflow:hidden}
.brow{text-align:left;display:flex;align-items:center;gap:10px;width:100%;border:0;border-bottom:1px solid #EEE;padding:10px 12px;background:#fff}.brow.on{background:var(--a1)}
.bar{display:block;height:6px;border-radius:999px;background:#E6E6E6;overflow:hidden}.bar i{display:block;height:100%}
.sheet{border:1px solid var(--a2);border-radius:10px;padding:14px;background:#F7F9FE;display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;font-size:12px}.grid2>div{background:#fff;border-radius:6px;padding:8px}
.lcard{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:8px;background:#fff;border:1px solid #E2E2E2}.lcard.no{border:1px dashed #8A8A8A}
.badge{font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;white-space:nowrap}
.badge.ok{background:var(--a);color:#fff}.badge.warn{background:var(--a2);color:var(--a9)}.badge.no{background:#fff;color:var(--t2);border:1px solid #8A8A8A}.badge.pending{background:#F0F0F0;color:var(--t3)}
.link{align-self:flex-start;font-size:12px;font-weight:600;color:var(--a8);background:transparent;border:0;padding:2px 0;text-decoration:underline}
.toast{margin:0 16px 12px;padding:10px 12px;background:#3A3A3A;color:#fff;border-radius:8px;font-size:13px;display:flex;align-items:center;gap:8px}
.pfoot{padding:10px 16px;border-top:1px solid #E8E8E8;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--t4)}
.status{display:flex;gap:20px;align-items:center;padding:6px 16px;background:#FAFAFA;border-top:1px solid #E2E2E2;font-size:12px;color:var(--t4);flex-wrap:wrap}
</style>
</head>

            (d && l.key !== 'custom' ? '<div style="display:flex;align-items:center;gap:8px"><span style="font-size:11px;color:var(--t4)">Fiabilité ' + r.score + '/100</span><span class="bar" style="flex:1"><i style="width:' + Math.max(r.score, 3) + '%;background:' + barColor(r.score) + '"></i></span></div>' : '') +
            (d && r.note ? '<button class="link" data-a="jump" data-v="' + r.note + '">Voir dans le texte</button>' : '') + '</div>';
        }).join('') + '</div><button class="big" data-a="place">' + (S.placed ? 'Analyser à nouveau' : 'Analyser et placer les sources') + '</button>';
    }
    h += '</div>' + (S.toast ? '<div class="toast" role="status"><span style="color:#B9C9F1">' + I.check + '</span>' + esc(S.toast) + '</div>' : '') +
      '<div class="pfoot"><span>Analyse locale · aucune donnée partagée</span><button class="bg" style="min-height:0;padding:5px 10px;font-size:12px" data-a="reset">Réinitialiser</button></div></aside>';
  }
  h += '</div><div class="status"><span>Page 4 sur 18</span><span>2 314 mots</span><span>Français (Suisse)</span><span style="display:flex;align-items:center;gap:6px;color:var(--a8);font-weight:600">' +
    (sc ? 'Vérisource : ' + pid.length + ' point(s) à vérifier · fiabilité ' + P + ' %' : 'Vérisource : document non analysé') + '</span><span style="margin-left:auto">Zoom 110 %</span></div></div>';

  var foc = document.activeElement && document.activeElement.id, pos = foc && document.activeElement.selectionStart;
  document.getElementById('app').innerHTML = h;
  if (foc === 'bq' || foc === 'lk') { var el = document.getElementById(foc); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) {} } }
}

document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-a]'); if (!b) return;
  var fn = A[b.getAttribute('data-a')]; if (fn) fn(b.getAttribute('data-v'));
});
document.addEventListener('change', function (e) {
  if (e.target.id === 'norme') set({ norme: e.target.value, toast: flash('Norme changée : ' + e.target.value) });
});
document.addEventListener('input', function (e) {
  if (e.target.id === 'bq') set({ biblioQuery: e.target.value });
  if (e.target.id === 'lk') S.linkInput = e.target.value;
});
document.addEventListener('keydown', function (e) { if (e.target.id === 'lk' && e.key === 'Enter') A.addLink(); });
render();
</script>
</body>
